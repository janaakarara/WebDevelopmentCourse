<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1 class="title">Todo App</h1>

    <!-- Input row -->
    <div class="input-row">
      <input type="text" id="todo-input" placeholder="What needs doing?" />
      <button id="add-btn" class="btn primary-btn">Add</button>
    </div>

    <!-- Controls row -->
    <div class="toolbar">
      <span class="hint">Tip: double-click a todo to edit. Press Enter to save.</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Todo list container -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- Bottom footer -->
    <div class="footer">
      <span id="items-left">0 items left</span>
      <div class="footer-actions">
        <button id="clear-completed" class="btn small-btn">Clear completed</button>
        <button id="clear-all" class="btn small-btn">Clear all</button>
      </div>
    </div>
  </div>

  <script  src="app.js"></script>
</body>
</html>
